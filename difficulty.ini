; difficulty.ini - modes shown in the NEW GAME difficulty menu.
;
; Put this file in the asset folder (next to the USA/ and JPN/ folders), or in
; the DC folder to override it for Director's Cut only. If the file is missing,
; the game uses the built-in STANDARD / TRAINING / ADVANCED trio.
;
; Modes are [Mode0] .. [Mode7]. They appear in the menu in number order, and
; a mode with no Name is skipped. Keys and section names are not case-sensitive.
;
; Keys per mode:
;   Name          Text shown in the menu (up to 23 characters, shown in capitals).
;   Dc            Director's Cut difficulty this mode uses: 0 = STANDARD,
;                 1 = TRAINING, 2 = ADVANCED. Only used in DC mode.
;   HealthChris   Starting health for Chris. 0 = leave the game's own value.
;   HealthJill    Starting health for Jill.  0 = leave the game's own value.
;                 (Health values go up to 255.)
;   WeaponDamage  Damage you deal, in percent. 100 = normal.
;   EnemyDamage   Damage you take, in percent. 100 = normal.
;                 (Read from this file, but not applied by the game yet.)
;   Ammo          Starting handgun ammo, in percent. 100 = normal.
;
; Any key you leave out keeps its normal value (percentages 100, health 0).

[Menu]
; 1 = show the difficulty menu after NEW GAME, 0 = skip it (starts Default).
Enabled=1
; Mode number that is highlighted when the menu opens.
Default=0

; --- The Director's Cut trio (default entries) ---------------------------

[Mode0]
Name=STANDARD
Dc=0

[Mode1]
Name=TRAINING
Dc=1
HealthChris=180
HealthJill=150

[Mode2]
Name=ADVANCED
Dc=2
HealthChris=100
HealthJill=70

; --- Examples of extra modes: remove the ';' at the start of each line ----
; In the default (USA) game they work as listed. In DC mode, Dc= decides which
